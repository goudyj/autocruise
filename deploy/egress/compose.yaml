# OPTIONAL overlay, not needed when autocruise runs at home. Routes the Android
# device and the browser through the user's own home connection (a Tailscale
# exit node). deploy/android/compose.yaml works on its own. See docs/EGRESS.md.
#
#   AUTOCRUISE_EXIT_NODE=<home-machine> \
#     docker compose -f deploy/android/compose.yaml -f deploy/egress/compose.yaml up -d
#   docker logs autocruise-egress      # first run: open the login URL once
services:
  egress:
    image: tailscale/tailscale:stable
    container_name: autocruise-egress
    hostname: autocruise-egress
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      TS_HOSTNAME: autocruise-egress
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # Optional: a pre-authorized key. Without it, the logs print a login URL.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: --exit-node=${AUTOCRUISE_EXIT_NODE:?set AUTOCRUISE_EXIT_NODE to your home exit node} --exit-node-allow-lan-access
      # The browser uses this as its proxy (Chrome resolves DNS through it too).
      TS_SOCKS5_SERVER: 0.0.0.0:1055
    ports:
      - "127.0.0.1:5555:5555" # adb of the Android device (shares this network)
      - "127.0.0.1:1055:1055" # SOCKS5 for the browser
    volumes:
      - egress-state:/var/lib/tailscale

  # The Android device leaves through the egress container.
  android:
    network_mode: service:egress
    ports: !reset []
    depends_on: [egress]

volumes:
  egress-state:
    name: autocruise-egress-state
