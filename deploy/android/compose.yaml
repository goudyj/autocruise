# Local Android device for autocruise app connectors. See docs/ANDROID.md.
#
#   sudo modprobe binder_linux        # once per boot (redroid needs binder)
#   docker compose -f deploy/android/compose.yaml up -d
#   adb connect 127.0.0.1:5555
services:
  android:
    image: redroid/redroid:14.0.0-latest
    container_name: autocruise-android
    # redroid needs privileged mode to mount binderfs. It does not hide that
    # it is a container: autocruise never disguises its device.
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555" # adb, local only
    volumes:
      - android-data:/data # apps and their logged-in sessions
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1440
      - androidboot.redroid_dpi=320

volumes:
  android-data:
    name: autocruise-android-data
